name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité du workspace
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm --filter @cofound/api prisma:generate

      - name: Construire les contrats partagés
        run: pnpm --filter @cofound/shared build

      - name: Vérifier le lint
        run: pnpm lint

      - name: Vérifier les types
        run: pnpm typecheck

      - name: Exécuter les tests
        run: pnpm test

      - name: Construire le workspace
        run: pnpm build

      - name: Vérifier le budget JavaScript initial
        run: pnpm check:bundle
