name: Déploiement staging

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/yonniverse/cofound-api
  BACKUP_IMAGE_NAME: ghcr.io/yonniverse/cofound-backup

jobs:
  publish:
    name: Publier les images staging
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image: ${{ steps.meta.outputs.image }}
      backup_image: ${{ steps.meta.outputs.backup_image }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Définir les tags staging
        id: meta
        run: |
          echo "image=${IMAGE_NAME}:staging-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backup_image=${BACKUP_IMAGE_NAME}:staging-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Construire et publier l’image API staging
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:staging

      - name: Construire et publier l’image backup staging
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backup/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backup_image }}
            ${{ env.BACKUP_IMAGE_NAME }}:staging

  deploy:
    name: Déployer staging
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Récupérer les fichiers de déploiement
        uses: actions/checkout@v4

      - name: Installer la clé SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}

      - name: Installer les hôtes connus
        env:
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copier la configuration staging
        env:
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$STAGING_DEPLOY_USER@$STAGING_DEPLOY_HOST" "mkdir -p '$STAGING_DEPLOY_PATH/deploy'"
          scp -o StrictHostKeyChecking=yes deploy/compose.production.yml deploy/Caddyfile "$STAGING_DEPLOY_USER@$STAGING_DEPLOY_HOST:$STAGING_DEPLOY_PATH/deploy/"

      - name: Mettre à jour les services staging
        env:
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          IMAGE: ${{ needs.publish.outputs.image }}
          BACKUP_IMAGE: ${{ needs.publish.outputs.backup_image }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh -o StrictHostKeyChecking=yes "$STAGING_DEPLOY_USER@$STAGING_DEPLOY_HOST" \
            "cd '$STAGING_DEPLOY_PATH' && sed -i 's#^COFOUND_API_IMAGE=.*#COFOUND_API_IMAGE=$IMAGE#; s#^COFOUND_BACKUP_IMAGE=.*#COFOUND_BACKUP_IMAGE=$BACKUP_IMAGE#' deploy/.env && docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && docker compose --env-file deploy/.env -f deploy/compose.production.yml pull && docker compose --env-file deploy/.env -f deploy/compose.production.yml up -d --remove-orphans && docker image prune -f"
