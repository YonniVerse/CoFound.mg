services:
  api:
    image: ${COFOUND_API_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    command:
      - sh
      - -c
      - ./node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && node dist/main.js
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ${COFOUND_API_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command: ["node", "dist/worker.js"]
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: ${COFOUND_BACKUP_IMAGE}
    profiles: ["backup"]
    env_file:
      - .env
    command: ["/usr/local/bin/backup.sh"]

  restore-test:
    image: ${COFOUND_BACKUP_IMAGE}
    profiles: ["restore-test"]
    env_file:
      - .env
    command: ["/usr/local/bin/restore-test.sh"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      COFOUND_DOMAIN: ${COFOUND_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
